<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Personality AI</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Login CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

    <!-- Theme CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

</head>

<body>

<!-- Floating Background -->

<div class="bg-animation">

    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

</div>

<!-- Theme Button -->

<button class="theme-btn"
        onclick="toggleTheme()">

    <i id="themeIcon"
       class="bi bi-moon-fill"></i>

</button>

<!-- Login Container -->

<div class="login-container">

    <div class="login-card">


        <h1>Welcome Back</h1>

        <p>

            Login to continue your AI Personality Prediction journey.

        </p>

        <form method="POST">

            <!-- Email -->

            <div class="input-group-custom">

                <input type="email"

                       name="email"

                       placeholder="Enter Email"

                       required>

                <i class="bi bi-envelope-fill"></i>

            </div>

            <!-- Password -->

            <div class="input-group-custom">

                <input type="password"

                       id="password"

                       name="password"

                       placeholder="Enter Password"

                       required>

                <i class="bi bi-eye-fill"
                   onclick="togglePassword()"></i>

            </div>

            <!-- Remember + Forgot -->

            <div class="remember-box">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

               <a href="{{ url_for('forgot_password') }}" class="forgot-link">
                  Forgot Password?
                 </a>

            </div>

            <!-- Login -->

            <button type="submit"

                    class="login-btn">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>

        <!-- Divider -->

        <div class="divider">

            <span>OR</span>

        </div>

<div class="social-login">

    
    <a href="{{ url_for('google_login') }}" class="social-btn google-btn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Google
    </a>

    

</div>
        <!-- Register -->

        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">

                Register

            </a>

        </div>

    </div>

</div>
<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Theme JS -->

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

<script>

function togglePassword(){

    let password = document.getElementById("password");

    let icon = event.target;

    if(password.type==="password"){

        password.type="text";

        icon.classList.remove("bi-eye-fill");

        icon.classList.add("bi-eye-slash-fill");

    }

    else{

        password.type="password";

        icon.classList.remove("bi-eye-slash-fill");

        icon.classList.add("bi-eye-fill");

    }

}

</script>

</body>

</html>
