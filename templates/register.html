<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AI Personality Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>

        body{
            background:#08111f;
            font-family:Arial, Helvetica, sans-serif;
        }

        .register-card{

            max-width:450px;

            margin:80px auto;

            background:#111c30;

            padding:40px;

            border-radius:20px;

            box-shadow:0 0 30px rgba(0,0,0,.35);

        }

        h2{

            color:white;

            text-align:center;

            margin-bottom:30px;

            font-weight:bold;

        }

        label{

            color:white;

            margin-bottom:8px;

        }

        .form-control{

            height:50px;

            border-radius:10px;

        }

        .btn-register{

            width:100%;

            height:50px;

            border:none;

            border-radius:10px;

            background:#6C63FF;

            color:white;

            font-size:18px;

            font-weight:bold;

            margin-top:15px;

        }

        .btn-register:hover{

            background:#574bff;

        }

        .login-text{

            text-align:center;

            margin-top:20px;

            color:white;

        }

        .login-text a{

            color:#6C63FF;

            text-decoration:none;

            font-weight:bold;

        }
        .register-card{
    position:relative;
}

.theme-btn{
    position:absolute;
    top:20px;
    right:20px;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#6F63FF;
    color:#fff;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.3s;
}

.theme-btn:hover{
    background:#5848ff;
    transform:scale(1.08);
}

    </style>

</head>

<body>
    <button class="theme-btn" onclick="toggleTheme()">
    <i id="themeIcon" class="bi bi-moon-fill"></i>
</button>

<div class="container">

    <div class="register-card">

        <h2>Create Account</h2>

        <form action="/register" method="POST">

            <div class="mb-3">

                <label>Full Name</label>

                <input type="text"
                       name="name"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Email</label>

                <input type="email"
                       name="email"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Password</label>

                <input type="password"
                       name="password"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label>Confirm Password</label>

                <input type="password"
                       name="confirm_password"
                       class="form-control"
                       required>

            </div>

            <button class="btn-register">

                Create Account

            </button>

        </form>

        <div class="login-text">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>

    </div>

</div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
