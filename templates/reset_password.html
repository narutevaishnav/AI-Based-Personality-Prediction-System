<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
</head>
<body>

<div class="container">

    <h2>Reset Password</h2>

    <form method="POST">

        <div class="input-box">
            <input
                type="password"
                name="password"
                placeholder="New Password"
                required>
        </div>

        <div class="input-box">
            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>
        </div>

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>
</html>
